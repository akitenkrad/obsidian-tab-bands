<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tab Bands — named, colour-coded, collapsible bands for the Obsidian tab strip</title>
<desc>A tab strip where related tabs are grouped into coloured bands; collapsing a band frees horizontal space.</desc>
<style>
  .ts    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 13px; fill: #444441; }
  .tl    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #534AB7; letter-spacing: 2px; }
  .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 30px; font-weight: 600; fill: #2C2C2A; }
  .glab  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 11px; font-weight: 500; fill: #888780; letter-spacing: 0.5px; }
  .gray-fill   { fill: #F1EFE8; stroke: #C7C5BD; stroke-width: 0.6; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.6; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.6; }
  .teal-bar    { fill: #0F6E56; }
  .purple-bar  { fill: #534AB7; }
  .teal-dot    { fill: #0F6E56; }
  .purple-dot  { fill: #534AB7; }
  .arrd { stroke: #534AB7; stroke-width: 1.6; fill: none; }
  @media (prefers-color-scheme: dark) {
    .ts    { fill: #C7C5BD; }
    .tl    { fill: #AFA9EC; }
    .title { fill: #E5E5E2; }
    .glab  { fill: #8C8B85; }
    .gray-fill   { fill: #3A3A37; stroke: #5F5E5A; }
    .purple-fill { fill: #534AB7; stroke: #AFA9EC; }
    .teal-fill   { fill: #0F6E56; stroke: #5DCAA5; }
    .teal-bar    { fill: #5DCAA5; }
    .purple-bar  { fill: #AFA9EC; }
    .teal-dot    { fill: #5DCAA5; }
    .purple-dot  { fill: #AFA9EC; }
    .arrd { stroke: #AFA9EC; }
  }
</style>
<defs>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="tl"    x="44" y="96">OBSIDIAN PLUGIN</text>
<text class="title" x="42" y="140">Tab Bands</text>
<text class="ts"    x="44" y="176">Group related tabs into named, colour-coded bands.</text>
<text class="ts"    x="44" y="198">Collapse the ones you are not using and get the</text>
<text class="ts"    x="44" y="220">width of the tab strip back.</text>

<rect class="gray-fill"   x="540" y="100" width="40" height="26" rx="4"/>
<rect class="teal-fill"   x="584" y="100" width="40" height="26" rx="4"/>
<rect class="teal-fill"   x="628" y="100" width="40" height="26" rx="4"/>
<rect class="gray-fill"   x="672" y="100" width="40" height="26" rx="4"/>
<rect class="purple-fill" x="716" y="100" width="40" height="26" rx="4"/>
<rect class="purple-fill" x="760" y="100" width="40" height="26" rx="4"/>
<circle class="teal-dot"   cx="594" cy="113" r="3"/>
<circle class="purple-dot" cx="726" cy="113" r="3"/>
<rect class="teal-bar"   x="584" y="128" width="84" height="3" rx="1.5"/>
<rect class="purple-bar" x="716" y="128" width="84" height="3" rx="1.5"/>
<text class="glab" x="812" y="118">expanded</text>

<path d="M780 144 V172" class="arrd" marker-end="url(#arrowAccent)"/>

<rect class="gray-fill"   x="540" y="178" width="40" height="26" rx="4"/>
<rect class="teal-fill"   x="584" y="178" width="44" height="26" rx="6"/>
<rect class="gray-fill"   x="632" y="178" width="40" height="26" rx="4"/>
<rect class="purple-fill" x="676" y="178" width="40" height="26" rx="4"/>
<rect class="purple-fill" x="720" y="178" width="40" height="26" rx="4"/>
<circle class="teal-dot"   cx="594" cy="191" r="3"/>
<circle class="purple-dot" cx="686" cy="191" r="3"/>
<rect class="teal-bar"   x="584" y="206" width="44" height="3" rx="1.5"/>
<rect class="purple-bar" x="676" y="206" width="84" height="3" rx="1.5"/>
<text class="glab" x="812" y="196">collapsed</text>
</svg>
