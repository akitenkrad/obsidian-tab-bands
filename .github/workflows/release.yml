name: Release

# バージョンタグ (例: 0.1.0) を push すると，main.js / manifest.json / styles.css を
# 添付した GitHub Release を作成する．
# Obsidian のコミュニティプラグインはこの 3 ファイルを Release アセットから取得するため，
# タグ名は manifest.json の version と完全に一致させ，先頭に "v" を付けないこと．
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "タグ ($TAG) と manifest.json の version ($MANIFEST) が一致しません"
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
