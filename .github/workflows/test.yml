name: Test

# main への push と，すべての Pull Request で型チェック・テスト・ビルドを通す．
# リリース (release.yml) はタグ push が起点なので，こちらとは独立している．
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ロックファイルは npm 11 系で生成している．Node 20 (npm 10) だと
      # optional な esbuild のプラットフォーム別パッケージの解釈が食い違い，
      # npm ci が EBADPLATFORM で落ちる (2026-08-29 に実際に踏んだ).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (型チェックを含む)
        run: npm run build
